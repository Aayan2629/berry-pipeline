# site.yml -- put the website live, and nothing else.
#
# GitHub -> Actions -> "Deploy website" -> Run workflow.
# Uploads the berry_internships.html that is already in the repo to
# Cloudflare Pages. No scraping, no carousels, NO Instagram posting -- so it is
# safe to press any time (e.g. to test the Cloudflare setup, or after fixing
# something on the page).

name: Deploy website

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in"
            echo "Settings -> Secrets and variables -> Actions first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/site"
          cp pipeline_scripts/berry_internships.html "$RUNNER_TEMP/site/index.html"
          npx --yes wrangler@4 pages project create internberry --production-branch=main || true
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" \
            --project-name=internberry --branch=main --commit-dirty=true
