# ---------------------------------------------------------------------------
# berry.yml -- the whole account, once a day, hands off.
#
# Scrapes, checks what closed, rebuilds the site, deploys it, builds the
# slides and posts whatever is due. Then it commits its own state back so the
# next run knows what it already did.
#
# RUN probe.yml FIRST. If the boards block GitHub's addresses this workflow
# will run perfectly and post nothing, which is the worst kind of broken.
#
# WHAT IT NEEDS (Settings -> Secrets and variables -> Actions)
#   IG_USER_ID          from your .env
#   IG_ACCESS_TOKEN     from your .env
#   IG_TOKEN_OBTAINED   from your .env, the ISO date, e.g. 2026-09-02
#   NETLIFY_TOKEN       from your .env
#   GH_SLIDES_TOKEN     a personal access token that can push to berry-slides
#
# Copy the values straight from .env into the secrets boxes. Never commit
# .env itself -- this workflow writes a fresh one at the start of every run
# and the runner is destroyed at the end of it.
#
# WHY IT RUNS EVERY DAY WHEN YOU ONLY POST THREE TIMES A WEEK
# publish_to_instagram.py already knows the schedule: Monday tech, Thursday
# business, Saturday engineering, and overflow parts on the following day. On
# any other day it finds nothing due and exits happily. Putting that decision
# in one place beats encoding the calendar twice and watching the two drift.
# ---------------------------------------------------------------------------
name: 1. berry, daily

on:
  schedule:
    # 21:20 UTC. That is 8:20am Sydney in summer, 7:20am in winter.
    # Twenty past, not on the hour: GitHub queues scheduled jobs and the top
    # of every hour is its busiest minute, so :00 is where the long delays
    # live. There is no guarantee on the minute either way -- if this has to
    # land at an exact time, GitHub cron is the wrong tool.
    - cron: '20 21 * * *'
  workflow_dispatch:
    # The "Run workflow" button asks this. Untick it to scrape, rebuild the
    # website + dashboard and put them online WITHOUT posting to Instagram.
    inputs:
      post:
        description: "Also post to Instagram if something is due?"
        type: boolean
        default: false

# Two runs must never overlap. The second one would read state the first has
# not committed yet and could post the same carousel twice. Queue, never
# cancel: a half-finished publish is worse than a late one.
concurrency:
  group: berry-pipeline
  cancel-in-progress: false

permissions:
  contents: write        # so it can commit its own state back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fonts
        # poster_template.py draws every slide with DejaVu and Nunito. Nunito
        # is in the repo; DejaVu comes with macOS but not with a bare Ubuntu
        # runner, and without it the slides render in a fallback face that
        # looks nothing like your account.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf       pipeline_scripts/fonts/ || true
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf  pipeline_scripts/fonts/ || true
          ls pipeline_scripts/fonts/

      - name: Write .env from the secrets
        # The scripts read .env and know nothing about GitHub. Writing the
        # file here means not one line of your pipeline had to change to run
        # in the cloud, and the same scripts still work on your Mac.
        env:
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:   ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_OBTAINED: ${{ secrets.IG_TOKEN_OBTAINED }}
          NETLIFY_TOKEN:     ${{ secrets.NETLIFY_TOKEN }}
          GH_SLIDES_TOKEN:   ${{ secrets.GH_SLIDES_TOKEN }}
        run: |
          cd pipeline_scripts
          {
            echo "IG_USER_ID=${IG_USER_ID}"
            echo "IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}"
            echo "IG_TOKEN_OBTAINED=${IG_TOKEN_OBTAINED}"
            echo "NETLIFY_TOKEN=${NETLIFY_TOKEN}"
            echo "GITHUB_TOKEN=${GH_SLIDES_TOKEN}"
          } > .env
          echo "wrote .env with $(wc -l < .env) keys"

      - name: Record status for the dashboard
        # The dashboard is a static page on Netlify, so it cannot read a
        # GitHub secret. The one non-secret fact it needs -- when the
        # Instagram token was last refreshed -- gets written here and rides
        # along with the state commit at the end of the run.
        env:
          IG_TOKEN_OBTAINED: ${{ secrets.IG_TOKEN_OBTAINED }}
        run: |
          python -c "import json,os,datetime; json.dump({'ig_token_obtained': os.environ.get('IG_TOKEN_OBTAINED',''), 'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')}, open('pipeline_scripts/status.json','w'), indent=2)"
          cat pipeline_scripts/status.json

      - name: Clone berry-slides
        # upload_slides.py pushes the JPEGs into this clone and Meta fetches
        # them from raw.githubusercontent. It expects the clone to sit beside
        # the project, the same as it does on your Desktop.
        env:
          GH_SLIDES_TOKEN: ${{ secrets.GH_SLIDES_TOKEN }}
        run: |
          cd ..
          git clone --depth 1 \
            "https://x-access-token:${GH_SLIDES_TOKEN}@github.com/${{ github.repository_owner }}/berry-slides.git" \
            berry-slides
          cd berry-slides
          git config user.name  "berry bot"
          git config user.email "actions@github.com"

      - name: Refresh
        # scrape, check what closed, rebuild the site, deploy it, build slides
        run: |
          cd pipeline_scripts
          python refresh.py

      - name: Put the website live (Cloudflare Pages)
        # Replaces Netlify. Netlify's free plan charges 15 credits a deploy and
        # pauses the site at 300, so a daily deploy killed it by day 20.
        # Cloudflare Pages' free plan allows 500 deploys a month and does not
        # charge for visitors, so the site can update every single day.
        #
        # wrangler is Cloudflare's own command-line tool. npx downloads and runs
        # it in one go (Node is already on GitHub's runners), so there is
        # nothing to install or keep in the repo.
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets yet -- website not deployed this run."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/site"
          cp pipeline_scripts/berry_internships.html "$RUNNER_TEMP/site/index.html"
          # Makes the project the first time; after that it just says it exists.
          npx --yes wrangler@4 pages project create internberry --production-branch=main || true
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" \
            --project-name=internberry --branch=main --commit-dirty=true

      - name: Post whatever is due
        # Scheduled runs always post; a button run only if you ticked the box.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.post }}
        # Exits 0 with "nothing due today" on the four non-posting days, so a
        # quiet day is a green tick rather than a red cross you learn to
        # ignore.
        id: post
        run: |
          cd pipeline_scripts
          set -o pipefail
          python publish_to_instagram.py 2>&1 | tee "$RUNNER_TEMP/post_output.txt"

      - name: Record why the post did or did not go out
        if: always()
        # An Actions log can only be read by someone with the repo open, and it
        # expires. "Why has nothing posted since Tuesday?" has to be answerable
        # from the dashboard alone, so the tail of the publish lands in
        # status.json and rides home with the state commit below.
        env:
          POST_OUTCOME: ${{ steps.post.outcome }}
        run: |
          python - <<'PY'
          import json, os, re, pathlib, datetime
          raw = pathlib.Path(os.environ["RUNNER_TEMP"]) / "post_output.txt"
          text = raw.read_text(errors="replace") if raw.exists() else ""
          # belt and braces: the scripts redact already, but never let a token near a
          # file that gets committed to a public repo.
          text = re.sub(r"(IGA[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|nfp_[A-Za-z0-9_]{20,})", "***", text)
          tail = [l.rstrip() for l in text.splitlines() if l.strip()][-14:]
          p = pathlib.Path("pipeline_scripts/status.json")
          d = json.loads(p.read_text()) if p.exists() else {}
          d["last_post"] = {
              "outcome": os.environ.get("POST_OUTCOME") or "unknown",
              "at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "log": tail,
          }
          p.write_text(json.dumps(d, indent=2))
          print("recorded:", d["last_post"]["outcome"])
          print("\n".join(tail))
          PY

      - name: Throw away old crawls
        # always(): a refused post must not throw away ten minutes of
        # scraping. The crawls and the site state are worth keeping whatever
        # Instagram said.
        if: always()
        # Every scrape writes a new dated folder and build_carousels.py reads
        # all of them. Left alone that grows forever and every run gets
        # slower. Twenty is far more history than anything here looks at.
        run: |
          cd output/seek_spider
          ls -1t | tail -n +21 | xargs -r rm -rf
          echo "$(ls -1 | wc -l) crawl(s) kept"

      - name: Put the dashboard online (Cloudflare Pages)
        # The same dashboard.html you open on your Mac, rebuilt AFTER today's
        # post so it shows what is left, and uploaded with the slide images it
        # points at. Lives at https://internberry-dashboard.pages.dev -- a separate
        # site from the public job board. It only ever SHOWS things: no button
        # on it can post.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "no Cloudflare secrets"; exit 0; }
          cd pipeline_scripts
          python dashboard.py --quiet
          D="$RUNNER_TEMP/dash"
          mkdir -p "$D"
          cp dashboard.html "$D/index.html"
          [ -d queue_carousels ] && cp -r queue_carousels "$D/"
          cp -r "background pics" "$D/"      # for the Photos wardrobe
          # keep it out of Google
          printf '/*\n  X-Robots-Tag: noindex\n' > "$D/_headers"
          npx --yes wrangler@4 pages project create internberry-dashboard --production-branch=main || true
          npx --yes wrangler@4 pages deploy "$D" --project-name=internberry-dashboard --branch=main --commit-dirty=true

      - name: Commit the state back
        if: always()
        # The runner is deleted when the job ends, so anything not committed
        # is forgotten -- and "what have I already posted" being forgotten
        # means posting it again tomorrow.
        run: |
          git config user.name  "berry bot"
          git config user.email "actions@github.com"
          # -A over the whole tree. .gitignore already states exactly what
          # must not be committed, so naming paths here only duplicates it --
          # and naming pipeline_scripts/*.json pulled in ig_posts.json, which
          # IS ignored. git exits non-zero when an ignored path is named
          # outright, and this step runs under `bash -e`, so every run died
          # here the moment if:always() let it run at all.
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "berry: $(date -u '+%Y-%m-%d %H:%M') run"
            git push
          fi

      - name: Keep the slides out of the log
        if: always()
        run: rm -f pipeline_scripts/.env
